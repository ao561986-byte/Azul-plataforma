<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - AZUL</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0b3d91, #1976d2);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 420px;
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 32px 26px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.20);
    }

    .logo {
        text-align: center;
        font-size: 42px;
        font-weight: bold;
        color: #0b3d91;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 28px;
    }

    h2 {
        text-align: center;
        color: #222;
        margin-bottom: 24px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 9px;
        font-size: 16px;
        margin-bottom: 18px;
    }

    input:focus {
        outline: none;
        border-color: #1976d2;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: #0b3d91;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #082f70;
    }

    .login {
        text-align: center;
        margin-top: 22px;
        color: #666;
    }

    .login a {
        color: #0b3d91;
        font-weight: bold;
        text-decoration: none;
    }

    .error {
        background: #ffe5e5;
        color: #b00020;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 18px;
        text-align: center;
    }

    .success {
        background: #e5f7e8;
        color: #176b2c;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 18px;
        text-align: center;
    }
</style>

</head><body><div class="container">
    <div class="card">    <div class="logo">AZUL</div>
    <div class="subtitle">Exportación inteligente desde Uruguay</div>

    <h2>Crear cuenta</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if message %}
        <div class="success">{{ message }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">

        <label for="name">Nombre</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Tu nombre"
            required
        >

        <label for="email">Correo electrónico</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            required
        >

        <label for="password">Contraseña</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            minlength="6"
            required
        >

        <button type="submit">
            Crear cuenta
        </button>

    </form>

    <div class="login">
        ¿Ya tenés una cuenta?
        <a href="{{ url_for('login') }}">Iniciar sesión</a>
    </div>

</div>

</div></body>
</html>
